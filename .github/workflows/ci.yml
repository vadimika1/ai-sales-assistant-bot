name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint, Tests, Compose Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_sales_assistant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Prepare env file
        run: cp .env.example .env

      - name: Preflight checks
        env:
          TELEGRAM_BOT_TOKEN: ci_dummy_token
          BOT_RUN_MODE: polling
          API_BASE_URL: http://127.0.0.1:8080
        run: |
          python scripts/preflight.py --target api
          python scripts/preflight.py --target bot

      - name: DB migrations smoke check
        run: python scripts/db_doctor.py --upgrade-head

      - name: Ruff
        run: python -m ruff check app tests scripts migrations

      - name: Pytest
        run: python -m pytest -q

      - name: Docker Compose config
        run: docker compose config
